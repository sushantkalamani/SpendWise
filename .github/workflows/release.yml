name: Android CI & Auto-Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto-Calculate and Bump Version
        id: bump_version
        run: |
          # Fetch all tags
          git fetch --tags
          
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Latest tag: $LATEST_TAG"
          
          # Get the merge commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit Message: $COMMIT_MSG"
          
          # Calculate new version name and version code dynamically using python
          python3 -c "
          import re, os, subprocess
          
          latest_tag = '$LATEST_TAG'
          if latest_tag.startswith('v'):
              latest_tag = latest_tag[1:]
              
          with open('app/build.gradle.kts', 'r') as f:
              content = f.read()
              
          if not latest_tag:
              version_name_match = re.search(r'versionName\s*=\s*\"([^\"]+)\"', content)
              latest_tag = version_name_match.group(1) if version_name_match else '1.0.0'
              
          commit_msg = '''$COMMIT_MSG'''.lower()
          
          bump_type = 'patch'
          if 'feat' in commit_msg or 'feature' in commit_msg:
              bump_type = 'minor'
          elif 'major' in commit_msg:
              bump_type = 'major'
              
          parts = latest_tag.split('.')
          if len(parts) != 3:
              parts = [parts[0], '0', '0']
              
          major = int(parts[0])
          minor = int(parts[1])
          patch = int(parts[2])
          
          if bump_type == 'major':
              major += 1
              minor = 0
              patch = 0
          elif bump_type == 'minor':
              minor += 1
              patch = 0
          else:
              patch += 1
              
          new_name = f'{major}.{minor}.{patch}'
          
          try:
              commit_count = int(subprocess.check_output(['git', 'rev-list', '--count', 'HEAD']).strip())
          except Exception:
              commit_count = 1
              
          print(f'Bumping from {latest_tag} to {new_name} with versionCode {commit_count}')
          
          content = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {commit_count}', content)
          content = re.sub(r'versionName\s*=\s*\"[^\"]+\"', f'versionName = \"{new_name}\"', content)
          
          with open('app/build.gradle.kts', 'w') as f:
              f.write(content)
              
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'new_version={new_name}\n')
          "

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          RENAMED_APK="app/build/outputs/apk/release/SpendWise-v${{ steps.bump_version.outputs.new_version }}.apk"
          mv "$APK_PATH" "$RENAMED_APK"
          echo "path=$RENAMED_APK" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump_version.outputs.new_version }}
          name: Release v${{ steps.bump_version.outputs.new_version }}
          files: ${{ steps.locate_apk.outputs.path }}
          generate_release_notes: true
          draft: false
          prerelease: false
